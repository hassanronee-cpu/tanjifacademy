<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রতিদিনের অভ্যাস | Tanjif Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --primary-light: #ccfbf1;
            --secondary: #0f172a;
            --surface: rgba(255, 255, 255, 0.92);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kalpurush', 'Hind Siliguri', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            padding-top: 65px;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
        }

        .logo span { color: var(--primary); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-score-box {
            background: rgba(13, 148, 136, 0.2);
            border: 1px solid var(--primary);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-score-box span {
            color: var(--primary-light);
            font-weight: 700;
        }

        .top-sync-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fef3c7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-sync-box.synced {
            color: #6ee7b7;
            border-color: #059669;
        }

        .btn-sheet-view {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 10px rgba(13, 148, 136, 0.3);
            transition: 0.2s;
        }

        .btn-sheet-view:hover { transform: translateY(-2px); }

        .app-container {
            max-width: 1380px;
            height: calc(100vh - 75px);
            margin: 0 auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            flex-grow: 1;
        }

        .category-column {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .category-header {
            background: var(--secondary);
            color: #fff;
            padding: 6px 10px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        .cat-score {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 8px;
            color: var(--primary-light);
        }

        .habit-list {
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: flex-start;
            flex-grow: 1;
        }

        .habit-item {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 8px;
            transition: all 0.3s ease;
        }

        .habit-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .habit-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .habit-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .info-btn {
            color: var(--primary);
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .short-msg {
            display: none;
            font-size: 0.72rem;
            color: #334155;
            background: var(--primary-light);
            padding: 4px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .note-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .note-input {
            flex-grow: 1;
            padding: 4px 6px;
            font-size: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            outline: none;
        }

        .note-save-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .note-save-btn:hover {
            background: var(--primary-dark);
        }

        .modal-overlay {
            position: fixed;
            top: 65px;
            left: 0;
            width: 100%;
            height: calc(100vh - 65px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-card {
            background: #f8fafc;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            background: var(--secondary);
            color: #fff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-close {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        .data-table th {
            background: #f1f5f9;
            color: var(--secondary);
            font-weight: 700;
        }

        @media(max-width: 1024px) {
            body { overflow: auto; height: auto; }
            .app-container { height: auto; }
            .categories-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">
            <i class="fa-solid fa-list-check" style="color: var(--primary);"></i>
            <span>প্রতিদিনের অভ্যাস</span> 
        </a>
        <div class="nav-right">
            <div class="top-score-box">
                আজকের স্কোর: <span id="navTodayScore">০ / ১০০</span>
            </div>
            <div class="top-sync-box" id="syncStatus">
                <i class="fa-solid fa-circle-check"></i> রেডি
            </div>
            <button class="btn-sheet-view" onclick="openSheetModal()">
                <i class="fa-solid fa-clock-rotate-left"></i> সংরক্ষিত ডাটা সামারি
            </button>
        </div>
    </nav>

    <div class="app-container">
        <div class="categories-grid" id="habitGrid"></div>
    </div>

    <!-- SUMMARY MODAL -->
    <div class="modal-overlay" id="sheetModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-history"></i> পূর্বের ইতিহাস সামারি</h3>
                <button class="modal-close" onclick="closeSheetModal()">বন্ধ করুন</button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; padding: 30px; color: var(--text-muted);" id="loadingState">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 10px;">গুগল শিট থেকে তথ্য লোড হচ্ছে...</p>
                </div>

                <div id="summaryContent" style="display: none;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>তারিখ</th>
                                <th>সর্বমোট অর্জন (স্কোর)</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3Hls2w-OPjH_t1jn3ztI2LBZx1JLfOxiTjCN7CSf0VDJnD-3-OUgCrC8gkdvm8quq/exec";

        const habitCategories = [
            {
                title: "সালাত চর্চা",
                items: [
                    { id: "s1", name: "ফজর", desc: "দিনের সূচনা ঈমানের সাথে করা।" },
                    { id: "s2", name: "জোহর", desc: "ব্যস্ততার মাঝে আত্মাকে বিরতি দেওয়া।" },
                    { id: "s3", name: "আসর", desc: "যথাসময়ে আসর আদায় করা।" },
                    { id: "s4", name: "মাগরিব", desc: "সূর্যাস্তের সাথে সাথে আনুগত্য প্রকাশ।" },
                    { id: "s5", name: "এশা", desc: "শান্তিময় ঘুমের পূর্বে আল্লাহর দরবারে উপস্থিতি।" }
                ]
            },
            {
                title: "কুরআন চর্চা",
                items: [
                    { id: "q1", name: "রিভিশন", desc: "পূর্বের পঠিত অংশ চর্চা।" },
                    { id: "q2", name: "মুখস্ত", desc: "নতুন আয়াত বা সূরা হেফজ।" },
                    { id: "q3", name: "শব্দে শব্দে", desc: "অর্থ ও অনুধাবন সহ পাঠ।" },
                    { id: "q4", name: "উচ্চস্বরে", desc: "স্পষ্ট ও সুন্দর কণ্ঠে তিলাওয়াত।" },
                    { id: "q5", name: "লিখে লিখে", desc: "আয়াত খাতায় লিখে চর্চা।" }
                ]
            },
            {
                title: "ভাষা চর্চা",
                items: [
                    { id: "l1", name: "সাধারন পাঠ", desc: "ইংরেজি/আরবি আর্টিক্যাল ৫ মিনিট পড়া।" },
                    { id: "l2", name: "ভোকাবুলারি", desc: "প্রতিদিন ৫টি নতুন শব্দ শেখা।" },
                    { id: "l3", name: "শোনা (Listen)", desc: "অডিও বা পডকাস্ট শোনা।" },
                    { id: "l4", name: "বলা (Speaking)", desc: "নিজে নিজে বা কারো সাথে বলা।" },
                    { id: "l5", name: "লেখা (Writing)", desc: "ছোট ৩-৪ লাইনের অনুচ্ছেদ লেখা।" }
                ]
            },
            {
                title: "শরীর চর্চা",
                items: [
                    { id: "b1", name: "হাঁটা", desc: "সকালে বা বিকালে ২০ মিনিট হাঁটা।" },
                    { id: "b2", name: "ব্যায়াম", desc: "ফ্রি-হ্যান্ড ব্যায়াম বা পুশ-আপ।" },
                    { id: "b3", name: "সুষম খাবার", desc: "প্রসেসড ফুড এড়িয়ে চলা।" },
                    { id: "b4", name: "সময় খেয়াল", desc: "সময়মতো আহার ও বিশ্রাম।" },
                    { id: "b5", name: "মানসিক স্বাস্থ্য", desc: "মেডিটেশন ও প্রশান্তি।" }
                ]
            },
            {
                title: "জ্ঞান চর্চা",
                items: [
                    { id: "k1", name: "বই পড়া", desc: "ভালো বইয়ের ১০ পাতা পড়া।" },
                    { id: "k2", name: "সংবাদ পড়া", desc: "গুরুত্বপূর্ণ আপডেট জানা।" },
                    { id: "k3", name: "সম্পর্ক খেয়াল", desc: "পারিবারিক স্বজনদের খোঁজ নেওয়া।" },
                    { id: "k4", name: "অর্থনীতি", desc: "আর্থিক সচেতনতা ও হিসাব।" },
                    { id: "k5", name: "ভালো কাজ", desc: "অন্তত ১টি নিঃস্বার্থ ভালো কাজ।" }
                ]
            }
        ];

        function toBanglaNum(num) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, d => banglaDigits[d]);
        }

        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        function formatDateClean(dateStr) {
            if (!dateStr) return '';
            try {
                const d = new Date(dateStr);
                if (!isNaN(d.getTime())) {
                    return d.toISOString().split('T')[0];
                }
            } catch (e) {}
            return dateStr.toString().split('T')[0].split(' ')[0];
        }

        function renderHabits() {
            const grid = document.getElementById('habitGrid');
            grid.innerHTML = '';
            const todayKey = getTodayKey();
            const completedToday = JSON.parse(localStorage.getItem(`completed_${todayKey}`) || '[]');

            habitCategories.forEach((cat, index) => {
                let col = document.createElement('div');
                col.className = 'category-column';
                
                let html = `
                    <div class="category-header">
                        <span>${cat.title}</span>
                        <span class="cat-score" id="cat-score-${index}">০ / ২০</span>
                    </div>
                    <div class="habit-list" id="cat-list-${index}">
                `;
                
                cat.items.forEach(item => {
                    const isDone = completedToday.some(c => c.id === item.id);
                    if (!isDone) {
                        html += `
                            <div class="habit-item" id="card-${item.id}">
                                <div class="habit-main">
                                    <label class="habit-label">
                                        <input type="checkbox" id="${item.id}">
                                        <span>${item.name}</span>
                                    </label>
                                    <i class="fa-solid fa-circle-info info-btn" onclick="toggleInfo('${item.id}-info')"></i>
                                </div>
                                <div class="short-msg" id="${item.id}-info">${item.desc}</div>
                                <div class="note-wrapper">
                                    <input type="text" class="note-input" id="${item.id}-note" placeholder="নোট লিখুন (বাধ্যতামূলক)...">
                                    <button class="note-save-btn" onclick="submitSingleTask('${item.id}', '${item.name}', ${index})">
                                        <i class="fa-solid fa-paper-plane"></i> সেভ
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                });

                html += `</div>`;
                col.innerHTML = html;
                grid.appendChild(col);
            });

            updateScores();
        }

        function toggleInfo(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function updateScores() {
            const todayKey = getTodayKey();
            const completedToday = JSON.parse(localStorage.getItem(`completed_${todayKey}`) || '[]');
            
            habitCategories.forEach((cat, catIdx) => {
                let catDoneCount = 0;
                cat.items.forEach(item => {
                    if (completedToday.some(c => c.id === item.id)) {
                        catDoneCount++;
                    }
                });
                const catScore = catDoneCount * 4;
                const catScoreEl = document.getElementById(`cat-score-${catIdx}`);
                if(catScoreEl) catScoreEl.innerText = `${toBanglaNum(catScore)} / ২০`;
            });

            const totalScore = completedToday.length * 4;
            document.getElementById('navTodayScore').innerText = `${toBanglaNum(totalScore)} / ১০০`;
            return totalScore;
        }

        async function submitSingleTask(itemId, itemName, catIndex) {
            const cb = document.getElementById(itemId);
            const noteInput = document.getElementById(`${itemId}-note`);
            const noteText = noteInput ? noteInput.value.trim() : "";

            if (!cb || !cb.checked) {
                alert("অনুগ্রহ করে টিক মার্ক (Check) দিন!");
                return;
            }

            if (noteText === "") {
                alert("সেভ করার জন্য নোট লেখা বাধ্যতামূলক!");
                noteInput.focus();
                return;
            }

            const statusBadge = document.getElementById('syncStatus');
            statusBadge.className = "top-sync-box";
            statusBadge.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> সেভ হচ্ছে...`;

            const todayKey = getTodayKey();
            let completedToday = JSON.parse(localStorage.getItem(`completed_${todayKey}`) || '[]');
            
            completedToday.push({ id: itemId, name: itemName, note: noteText });
            localStorage.setItem(`completed_${todayKey}`, JSON.stringify(completedToday));

            const totalScore = completedToday.length * 4;

            const payload = {
                date: todayKey,
                score: totalScore,
                taskName: itemName,
                note: noteText
            };

            const card = document.getElementById(`card-${itemId}`);
            if (card) {
                card.style.opacity = '0';
                setTimeout(() => {
                    card.remove();
                    updateScores();
                }, 300);
            }

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                statusBadge.className = "top-sync-box synced";
                statusBadge.innerHTML = `<i class="fa-solid fa-check-circle"></i> সেভ হয়েছে!`;
            } catch (error) {
                statusBadge.className = "top-sync-box synced";
                statusBadge.innerHTML = `<i class="fa-solid fa-check-circle"></i> সেভ হয়েছে!`;
            }
        }

        async function openSheetModal() {
            document.getElementById('sheetModal').style.display = 'flex';
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('summaryContent').style.display = 'none';

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const resData = await response.json();

                if (resData.status === 'success' && resData.data) {
                    renderSummaryTable(resData.data);
                } else {
                    document.getElementById('loadingState').innerHTML = `<p style="color:red;">ডাটা পাওয়া যায়নি বা লোড করতে সমস্যা হয়েছে।</p>`;
                }
            } catch (err) {
                document.getElementById('loadingState').innerHTML = `<p style="color:red;">ডাটা ফেচ করতে সমস্যা হয়েছে।</p>`;
            }
        }

        function renderSummaryTable(sheetRows) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('summaryContent').style.display = 'block';

            const historyBody = document.getElementById('historyTableBody');
            historyBody.innerHTML = '';

            const dateGrouped = {};

            sheetRows.forEach(row => {
                const cleanDate = formatDateClean(row.date);
                if (cleanDate) {
                    const currentScore = Number(row.score) || 0;
                    if (!dateGrouped[cleanDate] || currentScore > dateGrouped[cleanDate]) {
                        dateGrouped[cleanDate] = currentScore;
                    }
                }
            });

            const sortedDates = Object.keys(dateGrouped).sort().reverse();

            sortedDates.forEach(date => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${date}</b></td>
                    <td><b style="color: var(--primary-dark); font-size: 1.1rem;">${toBanglaNum(dateGrouped[date])}</b> / ১০০</td>
                `;
                historyBody.appendChild(tr);
            });
        }

        function closeSheetModal() {
            document.getElementById('sheetModal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', renderHabits);
    </script>
</body>
</html>
