<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আলোর কাফেলা | স্মার্ট বাজেট ২০২৬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0fdf4; padding-bottom: 100px; }
        .glass-card { background: white; border-radius: 24px; border: 1px solid #dcfce7; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .btn-green { background: #16a34a; color: white; transition: 0.3s; font-weight: bold; border-radius: 16px; }
        .btn-green:hover { background: #15803d; transform: translateY(-1px); }
        .btn-blue { background: #2563eb; color: white; transition: 0.3s; font-weight: bold; border-radius: 16px; }
        .btn-blue:hover { background: #1d4ed8; transform: translateY(-1px); }
        .input-box { width: 100%; padding: 14px; border-radius: 16px; border: 1px solid #bbf7d0; outline: none; transition: 0.3s; background: white; }
        .input-box:focus { border-color: #16a34a; box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1); }
        .active-tab { background: #16a34a !important; color: white !important; }
        .sync-loader { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .sync-btn-floating {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            background: #10b981; color: white; padding: 15px; border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; transition: 0.3s; border: none; cursor: pointer;
        }
        .budget-info-tag { font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 8px; margin-top: 5px; display: inline-block; }
        .islamic-pattern {
            background-image: url('https://www.transparenttextures.com/patterns/islamic-art.png');
            background-color: #064e3b;
        }
        #categoryManager {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            margin-top: 10px;
            border: 1px dashed #d1d5db;
        }
        #categoryManager input, #categoryManager select {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: white;
        }
        .update-section {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }
        .main-budget-display {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 8px 12px;
            margin-top: 6px;
            font-size: 12px;
        }
        /* Toast Notification */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 99999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            padding: 14px 24px; border-radius: 16px; color: white;
            font-weight: bold; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideIn 0.4s ease;
            min-width: 200px;
        }
        .toast-success { background: #16a34a; }
        .toast-error { background: #dc2626; }
        .toast-info { background: #2563eb; }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <header class="islamic-pattern text-white py-3 text-center mb-8 shadow-inner">
        <div class="max-w-2xl mx-auto px-2">
            <h1 class="text-3xl md:text-4xl font-black mb-4 tracking-tight">আর্থিক হিসাব</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-5">
            <div class="glass-card p-6 border-t-8 border-emerald-600 sticky top-10">
                <h2 class="text-xl font-bold text-emerald-900 mb-4 text-center">এন্ট্রি করুন ✍️</h2>
                <div class="flex bg-emerald-50 p-1 rounded-2xl mb-6">
                    <button onclick="setMode('expense')" id="modeExp" class="flex-1 py-3 rounded-xl font-bold text-sm active-tab">খরচ</button>
                    <button onclick="setMode('adjustment')" id="modeAdj" class="flex-1 py-3 rounded-xl font-bold text-sm text-emerald-700">সংশোধন</button>
                    <button onclick="toggleCategoryManager()" class="flex-1 py-3 rounded-xl font-bold text-sm text-emerald-700 bg-white/70">📂</button>
                </div>

                <div class="space-y-4">
                    <input type="date" id="date" class="input-box">
                    
                    <div id="expenseFields" class="space-y-4">
                        <div>
                            <select id="mainCat" onchange="updateSubCategories()" class="input-box">
                                <option value="">মূল খাত বেছে নিন</option>
                            </select>
                            <div id="mainCatInfo" class="mt-2 flex flex-wrap gap-1"></div>
                        </div>

                        <div>
                            <select id="subCat" onchange="updateSubDetailedInfo(this.value)" class="input-box">
                                <option value="">উপ-খাত বেছে নিন</option>
                            </select>
                            <div id="subCatInfo" class="mt-2 flex flex-wrap gap-1"></div>
                        </div>
                    </div>

                    <div id="adjFields" class="hidden space-y-4">
                        <select id="adjMain" onchange="updateAdjSub()" class="input-box">
                            <option value="">সংশোধন খাত বেছে নিন</option>
                            <option value="Earnings">Earnings (আয়)</option>
                            <option value="Liability">Liability (ঋণ)</option>
                            <option value="Investment">Investment (বিনিয়োগ)</option>
                            <option value="Savings">Savings (সঞ্চয়)</option>
                            <option value="Balance">Balance (ব্যালেন্স)</option>
                        </select>
                        <select id="adjSub" onchange="checkOthers(this.value)" class="input-box"><option value="">উপ-খাত বেছে নিন</option></select>
                    </div>

                    <div id="noteContainer" class="hidden">
                        <input type="text" id="customNote" placeholder="নোট লিখুন..." class="input-box border-emerald-300 bg-emerald-50">
                    </div>

                    <input type="number" id="amount" placeholder="৳ টাকার পরিমাণ" class="input-box text-2xl font-black text-emerald-900">
                    <button onclick="saveData()" id="saveBtn" class="w-full btn-green py-4 text-lg shadow-xl shadow-emerald-100">শিটে সেভ করুন 💾</button>
                </div>

                <!-- Category Manager (Hidden by default) -->
                <div id="categoryManager" class="hidden mt-6">
                    <h4 class="font-bold text-sm text-slate-700 mb-3">📁 ক্যাটাগরি ম্যানেজার</h4>
                    
                    <!-- Add Category -->
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="newCatName" placeholder="নতুন ক্যাটাগরি" class="input-box text-sm">
                        <button onclick="addCategory()" class="btn-green py-2 text-sm col-span-2">➕ নতুন মূল ক্যাটাগরি যোগ</button>
                    </div>
                    <div class="text-xs text-slate-500 mt-1 text-center">মূল ক্যাটাগরির লিমিট স্বয়ংক্রিয়ভাবে গণনা হবে</div>
                    <hr class="my-3">
                    
                    <!-- Add Sub Category -->
                    <div class="grid grid-cols-2 gap-2">
                        <select id="parentCatSelect" class="input-box text-sm"><option value="">মূল নির্বাচন</option></select>
                        <input type="text" id="newSubName" placeholder="উপ-ক্যাটাগরি" class="input-box text-sm">
                        <input type="number" id="newSubLimit" placeholder="লিমিট" class="input-box text-sm">
                        <button onclick="addSubCategory()" class="btn-green py-2 text-sm col-span-2">➕ উপ-ক্যাটাগরি যোগ</button>
                    </div>
                    <hr class="my-3">

                    <!-- Update Limit -->
                    <div class="update-section">
                        <h5 class="font-bold text-sm text-blue-700 mb-2">✏️ লিমিট আপডেট করুন</h5>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="updateMainSelect" class="input-box text-sm" onchange="populateUpdateSubSelects()">
                                <option value="">মূল ক্যাটাগরি</option>
                            </select>
                            <select id="updateSubSelect" class="input-box text-sm" onchange="showUpdateLimitFields()">
                                <option value="">উপ-ক্যাটাগরি</option>
                            </select>
                            <input type="number" id="updateLimitValue" placeholder="নতুন লিমিট" class="input-box text-sm col-span-2">
                            <button onclick="updateLimit()" class="btn-blue py-2 text-sm col-span-2">💾 লিমিট আপডেট করুন</button>
                        </div>
                        <div id="currentLimitDisplay" class="text-xs text-slate-600 mt-2 text-center"></div>
                        <div id="mainTotalDisplay" class="main-budget-display text-center text-emerald-700 font-bold hidden"></div>
                    </div>
                    <hr class="my-3">

                    <!-- Remove -->
                    <div class="grid grid-cols-2 gap-2">
                        <select id="removeMainSelect" class="input-box text-sm"><option value="">মূল ডিলিট</option></select>
                        <button onclick="removeCategory()" class="bg-red-500 text-white py-2 rounded-xl text-sm font-bold">🗑️ ডিলিট</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <select id="removeSubSelect" class="input-box text-sm"><option value="">উপ-ডিলিট</option></select>
                        <button onclick="removeSubCategory()" class="bg-red-500 text-white py-2 rounded-xl text-sm font-bold">🗑️ ডিলিট সাব</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 space-y-6">
            <div class="glass-card p-6 border-l-8 border-emerald-500">
                <h3 class="font-bold text-emerald-900 mb-4 border-b pb-2 flex justify-between items-center text-sm">
                    আর্থিক প্রোফাইল (লাইভ) <span id="syncTime" class="text-[10px] text-emerald-400 font-normal"></span>
                </h3>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="p-3 bg-amber-50 rounded-2xl border border-amber-100">
                        <p class="text-[9px] font-bold text-amber-600 uppercase">Balance</p>
                        <p id="statBalance" class="font-black text-amber-800 text-sm md:text-base">৳ ০</p>
                    </div>
                    <div class="p-3 bg-emerald-50 rounded-2xl border border-emerald-100">
                        <p class="text-[9px] font-bold text-emerald-600 uppercase">Savings</p>
                        <p id="statSavings" class="font-black text-emerald-700 text-sm md:text-base">৳ ০</p>
                    </div>
                    <div class="p-3 bg-red-50 rounded-2xl border border-red-100">
                        <p class="text-[9px] font-bold text-red-600 uppercase">Liability</p>
                        <p id="statLiability" class="font-black text-red-700 text-sm md:text-base">৳ ০</p>
                    </div>
                    <div class="p-3 bg-blue-50 rounded-2xl border border-blue-100">
                        <p class="text-[9px] font-bold text-blue-600 uppercase">Investment</p>
                        <p id="statInvestment" class="font-black text-blue-700 text-sm md:text-base">৳ ০</p>
                    </div>
                </div>
            </div>

            <button onclick="toggleReport()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-sm shadow-lg hover:bg-black transition-all flex items-center justify-center gap-2">
                📊 বিস্তারিত মাসিক রিপোর্ট (২৫-২৪ তারিখ)
            </button>

            <div class="glass-card p-6">
                <h4 class="text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-4">সাম্প্রতিক ৫টি এন্ট্রি</h4>
                <div id="recentList" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <div id="reportModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[999] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-[32px] p-6 md:p-8 relative shadow-2xl overflow-hidden">
            <button onclick="toggleReport()" class="absolute top-4 right-6 text-slate-400 hover:text-black text-2xl">✕</button>
            <h2 class="text-xl font-bold text-emerald-900 mb-6 flex items-center gap-2">
                <span class="p-2 bg-emerald-100 rounded-lg text-lg">📊</span> ২৫ তারিখের সাইকেল সামারি
            </h2>
            <div id="modalContent" class="space-y-3 max-h-[70vh] overflow-y-auto pr-2"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <button onclick="fetchFromSheet()" class="sync-btn-floating">
        <span id="syncIcon" class="text-xl">🔄</span>
    </button>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5wfDDeHkKaJ8A5FCccfK14NT63f90klVCyGGNM-VBRv-ii1v--WQGPZWyE9S0UEF6eA/exec";

        // Default structure - will be overwritten by sheet data
        let mainBudgets = {
            Installment: 0, Homeland: 0, Residential: 0, Sustenance: 0, 
            Transport: 0, Charity: 0, Essential: 0, Emergency: 0, Refreshment: 0, Savings: 0
        };

        let subBudgets = {
            "Loan (ঋণ পরিশোধ)": 15720, "Bank Interest (ব্যাংক মুনাফা/সুদ)": 0, "Others (অন্যান্য)": 0,
            "Parents (বাবা-মা)": 10380, "Village Cost (গ্রামের খরচ)": 0, "Others (অন্যান্য)": 0,
            "House Rent (বাসা ভাড়া)": 6000, "Electricity (বিদ্যুৎ বিল)": 1000, "Gas (গ্যাস বিল)": 1800, "Water (পানি বিল)": 100, "Internet (ইন্টারনেট বিল)": 650, "Mobile Bill (মোবাইল বিল)": 300, "Others (অন্যান্য)": 0,
            "Rice (চাল)": 1100, "Vegetable (শাক-সবজি)": 1500, "Milk (দুধ)": 1000, "Egg (ডিম)": 550, "Fruits (ফলমূল)": 400, "Fish (মাছ)": 3000, "Beef (গরুর মাংস)": 1000, "Chicken (মুরগির মাংস)": 500, "Grocery (মুদি সওদা)": 2600, "Stationary (ষ্টেশনারী)": 300, "Dry Food (শুকনা খাবার)": 300, "Others (অন্যান্য)": 200,
            "Workplace (অফিস যাতায়াত)": 1038, "Others (অন্যান্য)": 0,
            "Masjid (মসজিদ)": 500, "Sadakah (সাদাকাহ)": 278,
            "Learning (শিক্ষা)": 0, "Medical (চিকিৎসা)": 0, "Attire (পোশাক)": 0, "Others (অন্যান্য)": 519,
            "Hospital (হাসপাতাল)": 0, "Others (অন্যান্য)": 519,
            "Tour (ভ্রমণ)": 520, "Restuarent (রেস্তরা)": 0, "Others (অন্যান্য)": 0,
            "DPS (ডিপিএস)": 0, "FDR (এফডিআর)": 0, "Others (অন্যান্য)": 0
        };

        let subCategories = {
            Installment: ["Loan (ঋণ পরিশোধ)", "Bank Interest (ব্যাংক মুনাফা/সুদ)", "Others (অন্যান্য)"],
            Homeland: ["Parents (বাবা-মা)", "Village Cost (গ্রামের খরচ)", "Others (অন্যান্য)"],
            Residential: ["House Rent (বাসা ভাড়া)", "Electricity (বিদ্যুৎ বিল)", "Gas (গ্যাস বিল)", "Water (পানি বিল)", "Internet (ইন্টারনেট বিল)", "Mobile Bill (মোবাইল বিল)", "Others (অন্যান্য)"],
            Sustenance: ["Rice (চাল)", "Vegetable (শাক-সবজি)", "Milk (দুধ)", "Egg (ডিম)", "Fruits (ফলমূল)", "Fish (মাছ)", "Beef (গরুর মাংস)", "Chicken (মুরগির মাংস)", "Grocery (মুদি সওদা)", "Stationary (ষ্টেশনারী)", "Dry Food (শুকনা খাবার)", "Others (অন্যান্য)"],
            Transport: ["Workplace (অফিস যাতায়াত)", "Others (অন্যান্য)"],
            Charity: ["Masjid (মসজিদ)", "Sadakah (সাদাকাহ)"],
            Essential: ["Learning (শিক্ষা)", "Medical (চিকিৎসা)", "Attire (পোশাক)", "Others (অন্যান্য)"],
            Emergency: ["Hospital (হাসপাতাল)", "Others (অন্যান্য)"],
            Refreshment: ["Tour (ভ্রমণ)", "Restuarent (রেস্তরা)", "Others (অন্যান্য)"],
            Savings: ["DPS (ডিপিএস)", "FDR (এফডিআর)", "Others (অন্যান্য)"]
        };

        let expenses = [];
        let finance = { savings: 0, liability: 0, investment: 0, currentBalance: 0 };
        let currentMode = 'expense';

        // ================== TOAST NOTIFICATION ==================

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ================== CORE LOGIC ==================

        function isCurrentCycle(dateStr) {
            if(!dateStr) return false;
            const entryDate = new Date(dateStr);
            const now = new Date();
            let cycleStartMonth, cycleStartYear;

            if (now.getDate() >= 25) {
                cycleStartMonth = now.getMonth();
                cycleStartYear = now.getFullYear();
            } else {
                const lastMonth = new Date();
                lastMonth.setMonth(now.getMonth() - 1);
                cycleStartMonth = lastMonth.getMonth();
                cycleStartYear = lastMonth.getFullYear();
            }

            const startDate = new Date(cycleStartYear, cycleStartMonth, 25);
            const endDate = new Date(cycleStartYear, cycleStartMonth + 1, 24);
            endDate.setHours(23, 59, 59);
            return entryDate >= startDate && entryDate <= endDate;
        }

        // Calculate main budget from sub budgets
        function calculateMainBudget(mainCat) {
            if (!mainCat || !subCategories[mainCat]) return 0;
            let total = 0;
            subCategories[mainCat].forEach(sub => {
                total += subBudgets[sub] || 0;
            });
            return total;
        }

        // Update all main budgets
        function updateAllMainBudgets() {
            for (let main in subCategories) {
                mainBudgets[main] = calculateMainBudget(main);
            }
        }

        // ================== UI FUNCTIONS ==================

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeExp').className = `flex-1 py-3 rounded-xl font-bold text-sm ${mode==='expense'?'active-tab':'text-emerald-700'}`;
            document.getElementById('modeAdj').className = `flex-1 py-3 rounded-xl font-bold text-sm ${mode==='adjustment'?'active-tab':'text-emerald-700'}`;
            document.getElementById('expenseFields').classList.toggle('hidden', mode!=='expense');
            document.getElementById('adjFields').classList.toggle('hidden', mode!=='adjustment');
        }

        function populateMainDropdowns() {
            const selects = ['mainCat', 'parentCatSelect', 'removeMainSelect', 'updateMainSelect'];
            selects.forEach(id => {
                const sel = document.getElementById(id);
                if(!sel) return;
                const currentVal = sel.value;
                sel.innerHTML = `<option value="">${id==='mainCat'?'মূল খাত বেছে নিন':'নির্বাচন'}</option>`;
                Object.keys(subCategories).forEach(key => {
                    sel.innerHTML += `<option value="${key}">${key}</option>`;
                });
                if(currentVal && subCategories[currentVal]) sel.value = currentVal;
            });
            updateSubDropdowns();
            populateUpdateSubSelects();
        }

        function updateSubDropdowns() {
            const subSelects = ['subCat', 'removeSubSelect'];
            subSelects.forEach(id => {
                const sel = document.getElementById(id);
                if(!sel) return;
                const main = document.getElementById('mainCat').value;
                sel.innerHTML = `<option value="">উপ-খাত বেছে নিন</option>`;
                if(main && subCategories[main]) {
                    subCategories[main].forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
                }
            });
        }

        function populateUpdateSubSelects() {
            const main = document.getElementById('updateMainSelect').value;
            const sel = document.getElementById('updateSubSelect');
            sel.innerHTML = `<option value="">উপ-ক্যাটাগরি</option>`;
            if(main && subCategories[main]) {
                subCategories[main].forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
            }
            showUpdateLimitFields();
        }

        function showUpdateLimitFields() {
            const main = document.getElementById('updateMainSelect').value;
            const sub = document.getElementById('updateSubSelect').value;
            const display = document.getElementById('currentLimitDisplay');
            const mainDisplay = document.getElementById('mainTotalDisplay');
            let currentLimit = 0;
            let categoryName = '';
            
            if(sub) {
                currentLimit = subBudgets[sub] || 0;
                categoryName = sub;
                if(main) {
                    const mainTotal = calculateMainBudget(main);
                    mainDisplay.classList.remove('hidden');
                    mainDisplay.innerHTML = `📊 ${main} এর মোট লিমিট: ৳${mainTotal} (সব উপ-ক্যাটাগরির যোগফল)`;
                }
            } else if(main) {
                currentLimit = calculateMainBudget(main);
                categoryName = main + ' (মোট)';
                mainDisplay.classList.remove('hidden');
                mainDisplay.innerHTML = `📊 ${main} এর মোট লিমিট: ৳${currentLimit} (সব উপ-ক্যাটাগরির যোগফল)`;
            } else {
                mainDisplay.classList.add('hidden');
                mainDisplay.innerHTML = '';
            }
            
            if(categoryName) {
                display.innerHTML = `বর্তমান লিমিট: ৳${currentLimit} (${categoryName})`;
                document.getElementById('updateLimitValue').placeholder = `নতুন লিমিট (বর্তমান: ৳${currentLimit})`;
            } else {
                display.innerHTML = '';
                document.getElementById('updateLimitValue').placeholder = 'নতুন লিমিট';
                mainDisplay.classList.add('hidden');
            }
        }

        function updateSubCategories() {
            const main = document.getElementById('mainCat').value;
            const sub = document.getElementById('subCat');
            const infoDiv = document.getElementById('mainCatInfo');
            sub.innerHTML = `<option value="">উপ-খাত বেছে নিন</option>`;
            
            if (main && subCategories[main]) {
                const mainBudget = calculateMainBudget(main);
                const spent = getCycleSpentByMain(main);
                const remaining = mainBudget - spent;
                infoDiv.innerHTML = `
                    <span class="budget-info-tag bg-emerald-100 text-emerald-700">মোট বাজেট: ৳${mainBudget}</span>
                    <span class="budget-info-tag bg-blue-100 text-blue-700">খরচ: ৳${spent}</span>
                    <span class="budget-info-tag ${remaining < 0 ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}">বাকি: ৳${remaining}</span>
                `;
                if (subCategories[main]) subCategories[main].forEach(s => sub.innerHTML += `<option value="${s}">${s}</option>`);
            } else { infoDiv.innerHTML = ""; }
            document.getElementById('subCatInfo').innerHTML = "";
            updateSubDropdowns();
        }

        function updateSubDetailedInfo(subVal) {
            const infoDiv = document.getElementById('subCatInfo');
            const main = document.getElementById('mainCat').value;
            if (subVal && main) {
                const spent = getCycleSpentBySub(main, subVal);
                const budget = subBudgets[subVal] || 0;
                const remaining = budget - spent;
                let html = `<span class="budget-info-tag bg-slate-100 text-slate-600">খরচ: ৳${spent}</span>`;
                if (budget > 0) {
                    html = `
                        <span class="budget-info-tag bg-indigo-100 text-indigo-700">বাজেট: ৳${budget}</span>
                        <span class="budget-info-tag bg-blue-100 text-blue-700">খরচ: ৳${spent}</span>
                        <span class="budget-info-tag ${remaining < 0 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">বাকি: ৳${remaining}</span>
                    `;
                }
                infoDiv.innerHTML = html;
            } else { infoDiv.innerHTML = ""; }
            checkOthers(subVal);
        }

        function getCycleSpentByMain(main) {
            return expenses.filter(ex => ex.mode === 'expense' && ex.main === main && isCurrentCycle(ex.date))
                           .reduce((sum, ex) => sum + parseFloat(ex.amount), 0);
        }

        function getCycleSpentBySub(main, sub) {
            return expenses.filter(ex => ex.mode === 'expense' && ex.main === main && ex.sub.startsWith(sub) && isCurrentCycle(ex.date))
                           .reduce((sum, ex) => sum + parseFloat(ex.amount), 0);
        }

        function checkOthers(val) { 
            document.getElementById('noteContainer').classList.toggle('hidden', val !== 'Others' && !val.includes('Others')); 
        }

        function updateAdjSub() {
            const main = document.getElementById('adjMain').value;
            const sub = document.getElementById('adjSub');
            sub.innerHTML = `<option value="">উপ-খাত বেছে নিন</option>`;
            const adjSubCategories = {
                Earnings: ["Salary", "Bonus", "Dividend", "Others (+)", "Others (-)"],
                Liability: ["Personal Loan (+)", "Bank Loan (+)", "Loan Paid (-)", "Installment Paid (-)", "Others (+)", "Others (-)"],
                Investment: ["Share Market", "Savings Certificate", "Fixed Deposit", "Others (+)", "Others (-)"],
                Savings: ["Gift Received (+)", "Gift Given (-)", "Others (+)", "Others (-)"],
                Balance: ["Balance Surprise (+)", "Balance Lost (-)", "Others (+)", "Others (-)"]
            };
            if (adjSubCategories[main]) adjSubCategories[main].forEach(s => sub.innerHTML += `<option value="${s}">${s}</option>`);
        }

        function toggleCategoryManager() {
            const cm = document.getElementById('categoryManager');
            cm.classList.toggle('hidden');
            if(!cm.classList.contains('hidden')) {
                populateMainDropdowns();
                populateRemoveDropdowns();
                showUpdateLimitFields();
            }
        }

        function populateRemoveDropdowns() {
            const selMain = document.getElementById('removeMainSelect');
            const selSub = document.getElementById('removeSubSelect');
            selMain.innerHTML = `<option value="">মূল ডিলিট</option>`;
            Object.keys(subCategories).forEach(k => selMain.innerHTML += `<option value="${k}">${k}</option>`);
            selSub.innerHTML = `<option value="">উপ-ডিলিট</option>`;
            const parent = document.getElementById('parentCatSelect').value;
            if(parent && subCategories[parent]) {
                subCategories[parent].forEach(s => selSub.innerHTML += `<option value="${s}">${s}</option>`);
            }
        }

        // ================== SYNC WITH SHEET ==================

        async function fetchFromSheet() {
            const icon = document.getElementById('syncIcon');
            icon.classList.add('sync-loader');
            try {
                const res = await fetch(SCRIPT_URL + '?action=getAll');
                const data = await res.json();
                if(data.expenses) expenses = data.expenses;
                if(data.subBudgets) subBudgets = data.subBudgets;
                if(data.subCategories) subCategories = data.subCategories;
                updateAllMainBudgets();
                calculateFinance();
                refreshUI();
                populateMainDropdowns();
                populateRemoveDropdowns();
                updateSubCategories();
                showUpdateLimitFields();
                showToast('ডেটা সিঙ্ক সম্পন্ন!', 'success');
            } catch (e) { 
                showToast('সিঙ্ক এরর: ' + e.message, 'error');
            }
            icon.classList.remove('sync-loader');
            document.getElementById('syncTime').innerText = "Last sync: " + new Date().toLocaleTimeString();
        }

        function calculateFinance() {
            let tempFinance = { savings: 0, liability: 0, investment: 0, currentBalance: 0 };
            let totalExpense = 0;
            let totalEarnings = 0;
            
            expenses.forEach(ex => {
                const amt = parseFloat(ex.amount) || 0;
                if(ex.mode === 'expense') {
                    totalExpense += amt;
                    // Savings: all entries in Savings category
                    if(ex.main === 'Savings') tempFinance.savings += amt;
                    // Liability reduction: if main is Installment
                    if(ex.main === 'Installment') tempFinance.liability -= amt;
                }
                else if(ex.mode === 'adjustment') {
                    if(ex.main === 'Earnings') {
                        totalEarnings += amt;
                    }
                    if(ex.main === 'Investment') tempFinance.investment += amt;
                    if(ex.main === 'Liability') {
                        if(ex.sub.includes('(-)') || ex.sub.includes('Paid')) tempFinance.liability -= amt;
                        else tempFinance.liability += amt;
                    }
                    if(ex.main === 'Savings') {
                        if(ex.sub.includes('(-)')) tempFinance.savings -= amt;
                        else tempFinance.savings += amt;
                    }
                    if(ex.main === 'Balance') {
                        if(ex.sub.includes('(-)')) tempFinance.currentBalance -= amt;
                        else tempFinance.currentBalance += amt;
                    }
                }
            });
            
            // Balance = Total Earnings - Total Expense - Investment + Balance adjustments
            tempFinance.currentBalance = totalEarnings - totalExpense - tempFinance.investment + tempFinance.currentBalance;
            finance = tempFinance;
        }

        function refreshUI() {
            document.getElementById('recentList').innerHTML = expenses.slice(-5).reverse().map(ex => `
                <div class="p-3 bg-emerald-50/50 border border-emerald-100 rounded-xl text-[11px] flex justify-between shadow-sm">
                    <div><b>${ex.sub}</b><br><span class="text-slate-400 text-[9px]">${ex.date}</span></div>
                    <div class="font-black text-emerald-800">৳ ${parseFloat(ex.amount).toLocaleString()}</div>
                </div>
            `).join('') || "<p class='text-center text-slate-300 py-4'>No Entry Found</p>";

            document.getElementById('statSavings').innerText = `৳ ${finance.savings.toLocaleString()}`;
            document.getElementById('statLiability').innerText = `৳ ${finance.liability.toLocaleString()}`;
            document.getElementById('statInvestment').innerText = `৳ ${finance.investment.toLocaleString()}`;
            document.getElementById('statBalance').innerText = `৳ ${finance.currentBalance.toLocaleString()}`;
            
            if(document.getElementById('mainCat').value) updateSubCategories();
        }

        async function saveData() {
            const btn = document.getElementById('saveBtn');
            const main = currentMode === 'expense' ? document.getElementById('mainCat').value : document.getElementById('adjMain').value;
            const sub = currentMode === 'expense' ? document.getElementById('subCat').value : document.getElementById('adjSub').value;
            const note = document.getElementById('customNote').value;
            const amount = document.getElementById('amount').value;
            const date = document.getElementById('date').value;

            if(!date || !amount || !main || !sub) {
                showToast('দয়া করে, সব তথ্য দিন!', 'error');
                return;
            }

            btn.innerText = "পাঠানো হচ্ছে..."; btn.disabled = true;

            let finalSub = sub;
            if(sub.includes('Others')) {
                finalSub = note ? `${sub} (${note})` : sub;
            }

            const payload = { 
                date, amount, main, sub: finalSub, 
                mode: currentMode,
                action: 'addEntry'
            };

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast('✅ সফলভাবে আপডেট হয়েছে!', 'success');
                document.getElementById('amount').value = "";
                document.getElementById('customNote').value = "";
                await fetchFromSheet();
            } catch(e) { 
                showToast('কানেকশন এরর!', 'error');
            }
            btn.innerText = "শিটে সেভ করুন 💾"; btn.disabled = false;
        }

        // ================== CATEGORY MANAGEMENT ==================

        async function addCategory() {
            const name = document.getElementById('newCatName').value.trim();
            if(!name) {
                showToast('ক্যাটাগরির নাম দিন!', 'error');
                return;
            }
            if(subCategories[name]) {
                showToast('এই নামে ক্যাটাগরি ইতিমধ্যে আছে!', 'error');
                return;
            }
            
            subCategories[name] = ["Others (অন্যান্য)"];
            subBudgets["Others (অন্যান্য)"] = 0;
            updateAllMainBudgets();
            
            const payload = { action: 'addCategory', name };
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast('✅ ক্যাটাগরি যোগ হয়েছে!', 'success');
                document.getElementById('newCatName').value = '';
                await fetchFromSheet();
            } catch(e) { showToast('এরর!', 'error'); }
        }

        async function addSubCategory() {
            const parent = document.getElementById('parentCatSelect').value;
            const name = document.getElementById('newSubName').value.trim();
            const limit = parseFloat(document.getElementById('newSubLimit').value);
            if(!parent || !name || isNaN(limit)) {
                showToast('সব তথ্য দিন!', 'error');
                return;
            }
            if(subCategories[parent].includes(name)) {
                showToast('এই নামে উপ-ক্যাটাগরি ইতিমধ্যে আছে!', 'error');
                return;
            }
            
            subCategories[parent].push(name);
            subBudgets[name] = limit;
            updateAllMainBudgets();
            
            const payload = { action: 'addSubCategory', parent, name, limit };
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast('✅ উপ-ক্যাটাগরি যোগ হয়েছে!', 'success');
                document.getElementById('newSubName').value = '';
                document.getElementById('newSubLimit').value = '';
                await fetchFromSheet();
            } catch(e) { showToast('এরর!', 'error'); }
        }

        async function updateLimit() {
            const main = document.getElementById('updateMainSelect').value;
            const sub = document.getElementById('updateSubSelect').value;
            const newLimit = parseFloat(document.getElementById('updateLimitValue').value);
            
            if(!sub && !main) {
                showToast('একটি ক্যাটাগরি নির্বাচন করুন!', 'error');
                return;
            }
            if(isNaN(newLimit) || newLimit < 0) {
                showToast('সঠিক লিমিট দিন!', 'error');
                return;
            }
            
            const category = sub || main;
            const payload = { action: 'updateLimit', category, newLimit, main, sub };
            
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast(`✅ "${category}" এর লিমিট আপডেট হয়েছে!`, 'success');
                document.getElementById('updateLimitValue').value = '';
                await fetchFromSheet();
            } catch(e) { showToast('এরর! '+e.message, 'error'); }
        }

        async function removeCategory() {
            const name = document.getElementById('removeMainSelect').value;
            if(!name) {
                showToast('একটি ক্যাটাগরি নির্বাচন করুন!', 'error');
                return;
            }
            if(!confirm(`⚠️ "${name}" ডিলিট করবেন?`)) return;
            
            if(subCategories[name]) {
                subCategories[name].forEach(sub => {
                    delete subBudgets[sub];
                });
                delete subCategories[name];
            }
            updateAllMainBudgets();
            
            const payload = { action: 'removeCategory', name };
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast('✅ ডিলিট হয়েছে!', 'success');
                await fetchFromSheet();
            } catch(e) { showToast('এরর!', 'error'); }
        }

        async function removeSubCategory() {
            const name = document.getElementById('removeSubSelect').value;
            if(!name) {
                showToast('একটি উপ-ক্যাটাগরি নির্বাচন করুন!', 'error');
                return;
            }
            if(!confirm(`⚠️ "${name}" ডিলিট করবেন?`)) return;
            
            for (let main in subCategories) {
                const idx = subCategories[main].indexOf(name);
                if (idx > -1) {
                    subCategories[main].splice(idx, 1);
                    break;
                }
            }
            delete subBudgets[name];
            updateAllMainBudgets();
            
            const payload = { action: 'removeSubCategory', name };
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                showToast('✅ ডিলিট হয়েছে!', 'success');
                await fetchFromSheet();
            } catch(e) { showToast('এরর!', 'error'); }
        }

        // ================== REPORT ==================

        function toggleReport() {
            const modal = document.getElementById('reportModal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                const spentStats = {};
                expenses.filter(ex => isCurrentCycle(ex.date) && ex.mode === "expense").forEach(ex => { 
                    spentStats[ex.main] = (spentStats[ex.main] || 0) + parseFloat(ex.amount); 
                });
                let html = "";
                for (let cat in subCategories) {
                    let spent = spentStats[cat] || 0;
                    let budget = calculateMainBudget(cat);
                    let p = budget > 0 ? Math.min((spent / budget) * 100, 100) : 0;
                    html += `
                        <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-100">
                            <div class="flex justify-between items-center mb-2">
                                <div><p class="font-bold text-emerald-900">${cat}</p><p class="text-[10px] text-emerald-500 font-bold uppercase">বরাদ্দ: ৳${budget}</p></div>
                                <p class="font-black ${spent > budget ? 'text-red-600' : 'text-emerald-800'}">৳ ${spent}</p>
                            </div>
                            <div class="h-1.5 w-full bg-white rounded-full overflow-hidden">
                                <div class="h-full ${spent > budget ? 'bg-red-500' : 'bg-emerald-500'}" style="width: ${p}%"></div>
                            </div>
                        </div>`;
                }
                document.getElementById('modalContent').innerHTML = html;
            }
        }

        // ================== INIT ==================

        // Set default date to today
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = `${year}-${month}-${day}`;
        
        fetchFromSheet();

        // Event listeners
        document.getElementById('parentCatSelect')?.addEventListener('change', populateRemoveDropdowns);
        document.getElementById('updateMainSelect')?.addEventListener('change', populateUpdateSubSelects);
        document.getElementById('updateSubSelect')?.addEventListener('change', showUpdateLimitFields);
    </script>
</body>
